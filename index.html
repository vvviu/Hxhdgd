<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>X-RAY Platform - Anatomy Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #0A84FF; --green: #30D158; --red: #FF453A;
  --orange: #FF9F0A;
  --bg: #000000; --glass: rgba(28,28,30,0.80);
  --glass-border: rgba(255,255,255,0.09); --glass-hover: rgba(10,132,255,0.30);
  --text: #FFFFFF; --muted: rgba(255,255,255,0.40);
  --shadow: 0 20px 60px rgba(0,0,0,0.55);
}
[data-theme="light"] {
  --bg: #F2F2F7; --glass: rgba(255,255,255,0.78);
  --glass-border: rgba(0,0,0,0.07); --glass-hover: rgba(10,132,255,0.25);
  --text: #000000; --muted: rgba(0,0,0,0.38);
  --shadow: 0 20px 60px rgba(0,0,0,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 90% 50% at 50% -5%, rgba(10,132,255,0.28), transparent),
    radial-gradient(ellipse 40% 30% at 85% 85%, rgba(48,209,88,0.07), transparent);
  color:var(--text); font-family:'IBM Plex Sans Arabic',sans-serif;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:14px 14px 90px; transition:background .4s,color .4s;
}
.dynamic-island {
  position:fixed; top:12px; left:50%; transform:translateX(-50%);
  z-index:1000; display:flex; align-items:center; gap:8px;
  background:#1c1c1e; border-radius:22px; padding:8px 18px;
  box-shadow:0 8px 24px rgba(0,0,0,0.6); cursor:pointer;
  text-decoration:none; transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1); -webkit-tap-highlight-color:transparent;
}
.dynamic-island:active{transform:translateX(-50%) scale(0.96);background:#2c2c2e;}
.dynamic-island .di-icon{width:18px;height:18px;flex-shrink:0;fill:#24A1DE;}
.dynamic-island .di-text{font-weight:700;font-size:0.82rem;color:#ffffff;letter-spacing:0.5px;white-space:nowrap;}

.glass{background:var(--glass);backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);border:1px solid var(--glass-border);border-radius:22px;box-shadow:var(--shadow);}
.header{width:min(500px,100%);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;margin-top:54px;}
.logo{font-family:'Space Mono',monospace;font-size:.88rem;font-weight:700;letter-spacing:2px;color:var(--blue);}
.logo b{color:var(--text);}
.toggle-row{display:flex;align-items:center;gap:8px;}
.toggle-lbl{font-size:.62rem;font-weight:700;color:var(--muted);letter-spacing:1px;}
.ios-sw{width:51px;height:29px;background:#3a3a3c;border-radius:15px;position:relative;cursor:pointer;transition:background .3s;}
[data-theme="light"] .ios-sw{background:#e5e5ea;}
.ios-sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;background:#fff;border-radius:50%;transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 6px rgba(0,0,0,.3);}
[data-theme="light"] .ios-sw::after{transform:translateX(22px);}

.screen{width:min(500px,100%);display:none;}
.screen.active{display:block;}
.sec-label{font-size:.65rem;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin:20px 0 10px 4px;}

/* Lecture Cards */
.lec-card{padding:16px 18px;margin-bottom:9px;display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s,transform .15s,box-shadow .2s;}
.lec-card:active{transform:scale(0.98);}
.lec-card:hover{border-color:rgba(10,132,255,0.4);}
.lec-num{width:44px;height:44px;border-radius:11px;background:rgba(10,132,255,.12);border:1px solid rgba(10,132,255,.22);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:.72rem;font-weight:700;color:var(--blue);flex-shrink:0;}
.lec-body{flex:1;}
.lec-name{font-size:.93rem;font-weight:700;margin-bottom:3px;}
.lec-count{font-size:.72rem;color:var(--muted);}
.lec-arrow{color:var(--muted);font-size:1.2rem;}

/* Stats badge on cards */
.lec-badge{font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(48,209,88,0.15);color:var(--green);border:1px solid rgba(48,209,88,0.25);}

/* Progress */
.progress-wrap{margin-bottom:14px;padding:14px 18px;}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.prog-lec{font-size:.72rem;font-weight:700;color:var(--blue);letter-spacing:.5px;}
.prog-count{font-size:.72rem;color:var(--muted);}
.prog-bar{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0%;}

/* Quiz card */
.quiz-card{padding:22px 20px;margin-bottom:10px;}
.q-num{font-family:'Space Mono',monospace;font-size:.68rem;color:var(--muted);margin-bottom:8px;text-align:center;}
.q-text{font-size:1.0rem;font-weight:700;line-height:1.7;text-align:center;margin-bottom:20px;direction:ltr;}

/* Options */
.opt{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1.5px solid var(--glass-border);cursor:pointer;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:all .2s;direction:ltr;}
.opt:hover{border-color:rgba(10,132,255,0.4);background:rgba(10,132,255,0.06);}
.opt-letter{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:.72rem;font-weight:700;color:var(--muted);flex-shrink:0;transition:all .2s;}
.opt-text{font-size:.88rem;font-weight:600;flex:1;}
.opt.correct{border-color:var(--green);background:rgba(48,209,88,0.12);}
.opt.correct .opt-letter{background:var(--green);color:#fff;border-color:var(--green);}
.opt.wrong{border-color:var(--red);background:rgba(255,69,58,0.12);}
.opt.wrong .opt-letter{background:var(--red);color:#fff;border-color:var(--red);}
.opt.disabled{cursor:default;pointer-events:none;}

/* Next button */
.next-btn{width:100%;padding:15px;background:var(--blue);color:#fff;border:none;border-radius:14px;font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;display:none;margin-top:8px;transition:opacity .2s;}
.next-btn:active{opacity:.8;}

/* Result screen */
.result-card{padding:30px 24px;text-align:center;margin-bottom:12px;}
.result-score{font-family:'Space Mono',monospace;font-size:3rem;font-weight:700;color:var(--blue);margin-bottom:8px;}
.result-label{font-size:1rem;font-weight:700;margin-bottom:4px;}
.result-sub{font-size:.8rem;color:var(--muted);margin-bottom:24px;}
.result-grade{font-size:1.4rem;font-weight:800;margin-bottom:20px;}
.grade-a{color:var(--green);}
.grade-b{color:var(--blue);}
.grade-c{color:var(--orange);}
.grade-d{color:var(--red);}
.btn-restart{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:14px;font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;margin-bottom:10px;}
.btn-home{width:100%;padding:14px;background:rgba(255,255,255,0.06);color:var(--text);border:1.5px solid var(--glass-border);border-radius:14px;font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;}

/* Back button */
.back-btn{display:flex;align-items:center;gap:8px;padding:8px 0;margin-bottom:6px;cursor:pointer;color:var(--blue);font-weight:700;font-size:.85rem;background:none;border:none;font-family:'IBM Plex Sans Arabic',sans-serif;}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.quiz-card, .lec-card, .result-card{animation:fadeUp .35s ease both;}
.opt{animation:fadeUp .3s ease both;}
.opt:nth-child(1){animation-delay:.05s}
.opt:nth-child(2){animation-delay:.10s}
.opt:nth-child(3){animation-delay:.15s}
.opt:nth-child(4){animation-delay:.20s}
.opt:nth-child(5){animation-delay:.25s}
</style>
</head>

<div class="header glass">
  <div class="logo">X<b>-RAY</b> <span style="color:var(--muted);font-size:.7rem;letter-spacing:1px;">PLATFORM</span></div>
  <div class="toggle-row">
    <span class="toggle-lbl">MODE</span>

  </div>
</div>

<!-- Home Screen -->
<div id="screen-home" class="screen active">
  <div class="sec-label">المحاضرات المتاحة</div>
  <div id="lectures-list"></div>
</div>

<!-- Quiz Screen -->
<div id="screen-quiz" class="screen">
  <button class="back-btn" onclick="goHome()">← العودة للمحاضرات</button>
  <div class="progress-wrap glass">
    <div class="prog-top">
      <span class="prog-lec" id="prog-lec-name">جاري التحميل...</span>
      <span class="prog-count" id="prog-count">0/0</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
  </div>
  <div class="quiz-card glass">
    <div class="q-num" id="q-num"></div>
    <div class="q-text" id="q-text"></div>
    <div id="opts-wrap"></div>
    <button id="next-btn" class="next-btn" onclick="nextQuestion()">السؤال التالي ←</button>
  </div>
</div>

<!-- Result Screen -->
<div id="screen-result" class="screen">
  <div class="result-card glass">
    <div class="result-score" id="res-score">0/0</div>
    <div class="result-label">نتيجتك النهائية</div>
    <div class="result-sub" id="res-lec-name"></div>
    <div class="result-grade" id="res-grade"></div>
    <button class="btn-restart" onclick="restartQuiz()">🔄 إعادة المحاضرة</button>
    <button class="btn-home" onclick="goHome()">🏠 العودة للرئيسية</button>
  </div>
</div>

// ============================================================
// State
// ============================================================
let currentLec = null;
let currentQ = 0;
let score = 0;
let answered = false;

// ============================================================
// Init
// ============================================================
function init() {
  renderLectureList();
}

function renderLectureList() {
  const list = document.getElementById('lectures-list');
  list.innerHTML = '';
  QUESTIONS_DATA.forEach((lec, i) => {
    const card = document.createElement('div');
    card.className = 'lec-card glass';
    card.style.animationDelay = `${i * 0.08}s`;
    card.innerHTML = `
      <div class="lec-num">L${lec.id}</div>
      <div class="lec-body">
        <div class="lec-name">${lec.name}</div>
        <div class="lec-count">${lec.nameEn} · ${lec.questions.length} سؤال</div>
      </div>
      <div class="lec-arrow">›</div>
    `;
    card.onclick = () => startLecture(i);
    list.appendChild(card);
  });
}

function startLecture(idx) {
  currentLec = idx;
  currentQ = 0;
  score = 0;
  showScreen('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  const lec = QUESTIONS_DATA[currentLec];
  const q = lec.questions[currentQ];
  const total = lec.questions.length;

  // Progress
  document.getElementById('prog-lec-name').textContent = lec.name;
  document.getElementById('prog-count').textContent = `${currentQ + 1}/${total}`;
  const pct = ((currentQ) / total) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';

  // Question
  document.getElementById('q-num').textContent = `سؤال ${currentQ + 1} من ${total}`;
  document.getElementById('q-text').textContent = q.q;

  // Options
  const wrap = document.getElementById('opts-wrap');
  wrap.innerHTML = '';
  const letters = ['A','B','C','D','E'];
  q.opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'opt glass';
    div.innerHTML = `<div class="opt-letter">${letters[i]}</div><span class="opt-text">${opt}</span>`;
    div.onclick = () => selectAnswer(i, div);
    wrap.appendChild(div);
  });

  // Hide next button
  const nb = document.getElementById('next-btn');
  nb.style.display = 'none';
  answered = false;
}

function selectAnswer(idx, el) {
  if (answered) return;
  answered = true;

  const lec = QUESTIONS_DATA[currentLec];
  const q = lec.questions[currentQ];
  const opts = document.querySelectorAll('.opt');

  opts.forEach(o => o.classList.add('disabled'));

  if (idx === q.ans) {
    score++;
    el.classList.add('correct');
  } else {
    el.classList.add('wrong');
    opts[q.ans].classList.add('correct');
  }

  const nb = document.getElementById('next-btn');
  const isLast = currentQ === lec.questions.length - 1;
  nb.textContent = isLast ? 'عرض النتيجة ✓' : 'السؤال التالي ←';
  nb.style.display = 'block';
}

function nextQuestion() {
  const lec = QUESTIONS_DATA[currentLec];
  if (currentQ < lec.questions.length - 1) {
    currentQ++;
    renderQuestion();
    // Animate card
    const card = document.querySelector('.quiz-card');
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'fadeUp .35s ease both';
  } else {
    showResult();
  }
}

function showResult() {
  const lec = QUESTIONS_DATA[currentLec];
  const total = lec.questions.length;
  const pct = Math.round((score / total) * 100);

  document.getElementById('res-score').textContent = `${score}/${total}`;
  document.getElementById('res-lec-name').textContent = lec.name + ' — ' + lec.nameEn;

  let grade, cls;
  if (pct >= 90) { grade = '🏆 ممتاز!'; cls = 'grade-a'; }
  else if (pct >= 75) { grade = '✅ جيد جداً'; cls = 'grade-b'; }
  else if (pct >= 60) { grade = '📚 جيد'; cls = 'grade-c'; }
  else { grade = '⚠️ يحتاج مراجعة'; cls = 'grade-d'; }

  const gradeEl = document.getElementById('res-grade');
  gradeEl.textContent = grade + ` (${pct}%)`;
  gradeEl.className = 'result-grade ' + cls;

  // Update progress bar to 100%
  document.getElementById('prog-fill').style.width = '100%';

  showScreen('screen-result');
}

function restartQuiz() {
  startLecture(currentLec);
}

function goHome() {
  showScreen('screen-home');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function toggleMode() {
  const body = document.body;
  const current = body.getAttribute('data-theme');
  body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
}

init();
</script>
